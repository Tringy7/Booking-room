<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OTP Verification</title>
</head>
<body style="margin:0; padding:0; font-family: Arial, sans-serif; background-color:#f4f4f4;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:20px;">
    <tr>
        <td align="center">
            <table width="500px" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; padding:20px;">

                <!-- Title -->
                <tr>
                    <td align="center" style="font-size:22px; font-weight:bold; color:#333;">
                        Xác thực OTP
                    </td>
                </tr>

                <!-- Message -->
                <tr>
                    <td style="padding-top:15px; font-size:14px; color:#555;">
                        Mã OTP của bạn là:
                    </td>
                </tr>

                <!-- OTP -->
                <tr>
                    <td align="center" style="padding:20px;">
                        <div style="font-size:30px; font-weight:bold; letter-spacing:5px; color:#2d89ef;">
                            <span th:text="${otp}"></span>
                        </div>
                    </td>
                </tr>

                <!-- Expire note -->
                <tr>
                    <td style="font-size:13px; color:#999;">
                        Mã này sẽ hết hạn sau 5 phút. Vui lòng không chia sẻ với bất kỳ ai.
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="padding-top:20px; font-size:12px; color:#aaa; text-align:center;">
                        © 2026 Booking Room System
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
